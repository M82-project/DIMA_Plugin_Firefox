name: Regenerate package-lock.json

# Workflow manuel à lancer quand le lockfile a été régénéré sur un OS qui
# n'est pas Linux (Windows / macOS), ce qui casse `npm ci` côté CI à cause
# du bug npm/cli#4828 (les optional deps natives ne sont inscrites que
# pour la plateforme de génération). Ce workflow tourne sur ubuntu-latest,
# régénère le lockfile, et ouvre une PR avec le résultat.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate package-lock.json on Linux
        run: |
          rm -f package-lock.json
          # --package-lock-only évite de remplir node_modules pour rien,
          # on ne veut produire que le fichier de lock.
          npm install --package-lock-only --no-audit

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet package-lock.json; then
            echo "::notice::package-lock.json est déjà à jour, rien à faire."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          BRANCH="chore/regenerate-lockfile-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add package-lock.json
          git commit -m "chore: regenerate package-lock.json on Linux

          Resolves npm/cli#4828 — lockfile previously contained native
          optional deps for a single platform only.

          Generated by the regenerate-lockfile workflow."
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title 'chore: regenerate package-lock.json on Linux' \
            --body 'Régénération automatique de `package-lock.json` sur Linux via le workflow `Regenerate package-lock.json` (workaround npm/cli#4828). Si CI passe, le lockfile committé est cross-plateforme et utilisable par `npm ci` sur Linux / Windows / macOS.'
