name: CI

on:
  pull_request:
  push:
    branches: [main]

# Principe du moindre privilège pour GITHUB_TOKEN : ces jobs n'ont besoin
# que de lire le code source.
permissions:
  contents: read

# Annule les runs précédents sur la même PR si un nouveau push arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Workaround pour le bug npm/cli#4828 : un lockfile généré sur
        # un seul OS pinne les optional deps natives pour CET OS
        # uniquement (ex. @rollup/rollup-win32-x64-msvc mais pas
        # @rollup/rollup-linux-x64-gnu). `npm ci` ET `npm install`
        # honorent ce pinning et omettent silencieusement le binaire
        # Linux, après quoi Rollup plante au require().
        # Fix : on supprime le lockfile pour forcer npm à reconstruire
        # l'arbre depuis package.json sur la plateforme courante. Le
        # lockfile reste utile pour les contributeurs locaux ; la
        # version CI est jetée à la fin du run.
        run: |
          rm -f package-lock.json
          npm install --no-audit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Test (Vitest)
        run: npm test

      # Sécurité supply chain : fail si une vulnérabilité de niveau `high`
      # ou `critical` est connue dans le graphe de dépendances. La base
      # CVE GitHub Advisory est consultée à chaque run, on n'a rien à
      # maintenir côté repo. L'arbre est 100% devDependencies, mais on
      # audite tout : un outil de test compromis pourrait exfiltrer le code.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  amo-lint:
    name: web-ext lint (Mozilla addons-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run web-ext lint
        # Même linter que celui qu'AMO exécute à la soumission.
        # On ignore les fichiers non-packagés pour éviter les faux positifs.
        run: |
          npx --yes web-ext@8 lint \
            --source-dir=. \
            --ignore-files='.github/**' '.claude/**' 'documentation/**' \
                           'tests/**' 'node_modules/**' 'coverage/**' \
                           'package.json' 'package-lock.json' \
                           'eslint.config.js' 'vitest.config.js' \
                           '*.md' 'LICENSE' '.gitignore'
